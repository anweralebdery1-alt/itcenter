{% extends "admin/change_list.html" %}
{% load i18n %}

{% block extrastyle %}{{ block.super }}
<style>
  /* إخفاء الفلتر الجانبي وتوسيع الجدول */
  #changelist-filter, #changelist-filter-clear { display: none !important; }
  #changelist .results, #changelist .paginator,
  #changelist #changelist-form .actions { margin-right: 0 !important; margin-left: 0 !important; }
  #changelist { display: block !important; }

  /* كل الأعمدة تظهر: التفاف النص + خط أصغر + بلا تمرير جانبي */
  #result_list { width: 100% !important; font-size: 11px; }
  #result_list th, #result_list td {
    white-space: normal !important;
    word-break: break-word; overflow-wrap: anywhere;
    vertical-align: top; padding: 4px 6px !important;
  }
  #result_list th { font-size: 10px; line-height: 1.3; }
  /* حقول التعديل ضيّقة + إزالة أسهم الأرقام لتوفير المساحة */
  #result_list td input[type="number"] {
    width: 66px !important; min-width: 0; box-sizing: border-box;
    font-size: 11px; padding: 2px 3px !important; text-align: left;
    -moz-appearance: textfield;
  }
  #result_list td input[type="number"]::-webkit-outer-spin-button,
  #result_list td input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  #result_list td input[type="text"] {
    width: 110px !important; min-width: 0; box-sizing: border-box;
    font-size: 11px; padding: 2px 3px !important;
  }
  /* «الاسم الجديد» صندوق نص متعدّد الأسطر يلتف ولا يُخفي شيئاً — أضيق لتوسيع باقي الأعمدة */
  #result_list td.field-name { min-width: 150px; max-width: 175px; }
  #result_list td.field-name textarea,
  #result_list textarea.review-name-edit {
    width: 165px !important; min-width: 0; box-sizing: border-box;
    font-size: 11px; line-height: 1.35; padding: 3px 5px !important;
    resize: both; white-space: normal; overflow: auto;
    direction: rtl; unicode-bidi: plaintext; text-align: right;
  }
  /* الاسم القديم أضيق أيضاً لتوفير المجال */
  #result_list td.field-legacy_name { max-width: 150px; font-size: 10.5px; color:#555; }

  /* شريط دليل الألوان + القوائم السريعة */
  .price-legend { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin:6px 0 10px; padding:8px 12px; background:#f5f7fa; border:1px solid #e2e6ea;
    border-radius:6px; font-size:12px; line-height:1.9; }
  .price-legend .chip { color:#fff; padding:2px 8px; border-radius:4px; white-space:nowrap; }
  .price-legend .sep { color:#999; margin:0 4px; }
  .price-legend a.qf { text-decoration:none; padding:3px 10px; border:1px solid #cfd6dd;
    border-radius:4px; background:#fff; color:#2b3a4a; white-space:nowrap; }
  .price-legend a.qf:hover { background:#eef3f8; }
</style>
{% endblock %}

{% block result_list %}
<div class="price-legend">
  <b>مقارنة سعرك بالمنافس:</b>
  <span class="chip" style="background:#b71c1c">أعلى +٣٠٪</span>
  <span class="chip" style="background:#ef6c00">أعلى +١٠٪</span>
  <span class="chip" style="background:#2e7d32">ضمن النطاق</span>
  <span class="chip" style="background:#00838f">أقل −١٠٪</span>
  <span class="chip" style="background:#0d47a1">أقل −٣٠٪</span>
  <span class="sep">|</span>
  <b>قوائم:</b>
  <a class="qf" href="?">الكل</a>
  <a class="qf" href="?reviewed__exact=0">لم تُفحَص بعد</a>
  <a class="qf" href="?reviewed__exact=1">تم فحصها</a>
  <a class="qf" href="?has_image=no">بلا صورة</a>
</div>
{{ block.super }}
{% endblock %}
